name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install simulator
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Check reference designs
        run: rtlbench check-tasks
      - name: Unit tests
        run: pytest -q
      - name: Benchmark (mock provider)
        run: rtlbench run experiments/mock/*.yaml
      - name: Regression gate
        run: rtlbench gate mock-cascade --min-pass 0.85 --max-cost-per-task 0.005
      - name: Build report
        run: |
          rtlbench report --html site/index.html --markdown site/summary.md
          cat site/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
