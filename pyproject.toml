[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtlbench"
version = "0.1.0"
description = "Evaluation, cost and telemetry harness for LLM-generated RTL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pyyaml>=6.0",
  "anthropic>=0.70",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rtlbench = "rtlbench.cli:main"

[tool.setuptools]
packages = ["rtlbench"]

[tool.setuptools.package-data]
rtlbench = ["pricing.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
