# USD per million tokens. Check against the provider's pricing page before
# trusting cost numbers; these change.
# cache_write is billed at 1.25x input for the default 5-minute TTL.
models:
  claude-opus-5-5:   {input: 4.00, output: 20.00, cache_read: 0.20}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.10}
  claude-haiku-5-5:  {input: 0.10, output: 0.50,  cache_read: 0.01}
  # Offline provider used in tests and CI. Priced like a mid-tier model so
  # reports look realistic.
  mock-small: {input: 0.10, output: 0.50, cache_read: 0.01}
  mock-large: {input: 4.00, output: 20.00, cache_read: 0.20}
cache_write_multiplier: 1.25
